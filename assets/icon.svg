<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Unofficial TelegramNewsAI icon</title>
  <desc id="desc">Original dark blue news-monitoring icon with a luminous lens, network nodes and a compact news card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04152f"/>
      <stop offset="0.55" stop-color="#082b67"/>
      <stop offset="1" stop-color="#031224"/>
    </linearGradient>
    <radialGradient id="iris" cx="38%" cy="30%" r="72%">
      <stop offset="0" stop-color="#75f6ff"/>
      <stop offset="0.42" stop-color="#1ac9ff"/>
      <stop offset="0.76" stop-color="#1778ff"/>
      <stop offset="1" stop-color="#072d73"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7efff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="20" y="20" width="472" height="472" rx="96" fill="url(#bg)" stroke="#1264c7" stroke-width="3"/>
  <circle cx="256" cy="236" r="155" fill="none" stroke="#0b5bc0" stroke-width="7" opacity=".62"/>
  <circle cx="256" cy="236" r="116" fill="none" stroke="#34e9ff" stroke-width="17" filter="url(#glow)"/>
  <circle cx="256" cy="236" r="82" fill="none" stroke="#9cf9ff" stroke-width="7"/>
  <circle cx="256" cy="236" r="66" fill="url(#iris)"/>
  <circle cx="256" cy="236" r="30" fill="#06172e"/>
  <circle cx="280" cy="211" r="10" fill="#fff"/>

  <g stroke="#51efff" stroke-width="7" stroke-linecap="round" fill="#51efff">
    <line x1="256" y1="67" x2="256" y2="94"/><circle cx="256" cy="61" r="9"/>
    <line x1="139" y1="108" x2="157" y2="127"/><circle cx="132" cy="101" r="9"/>
    <line x1="373" y1="108" x2="355" y2="127"/><circle cx="380" cy="101" r="9"/>
    <line x1="89" y1="236" x2="116" y2="236"/><circle cx="79" cy="236" r="9"/>
    <line x1="423" y1="236" x2="396" y2="236"/><circle cx="433" cy="236" r="9"/>
  </g>

  <g transform="translate(112 314)">
    <rect x="19" y="28" width="250" height="92" rx="24" fill="#138de0" opacity=".65"/>
    <rect x="0" y="0" width="288" height="104" rx="25" fill="url(#card)" stroke="#a6e9ff" stroke-width="2"/>
    <rect x="24" y="22" width="66" height="60" rx="12" fill="#1057bd"/>
    <circle cx="74" cy="38" r="7" fill="#69e9ff"/>
    <path d="M31 75 50 52l15 16 10-12 13 19z" fill="#65caff"/>
    <g fill="#1256b4">
      <rect x="112" y="25" width="142" height="13" rx="6.5"/>
      <rect x="112" y="49" width="128" height="13" rx="6.5"/>
      <rect x="112" y="73" width="96" height="13" rx="6.5"/>
