name: One-time pre-public GitHub cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pre_public_cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete refs and releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          delete_api() {
            local path="$1"
            local label="$2"
            local body code
            body="$(mktemp)"
            code="$(curl --silent --show-error --output "$body" --write-out "%{http_code}" \
              --request DELETE \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/$path")"
            if [[ "$code" == "204" ]]; then
              echo "deleted: $label"
            elif [[ "$code" == "404" ]]; then
              echo "already absent: $label"
            else
              echo "GitHub API delete failed for $label (HTTP $code)"
              cat "$body"
              exit 1
            fi
            rm -f "$body"
          }

          for branch in             "ci/continuity-5.5.0-validation"             "experiment/web-preview-collector"             "feature/continuity-context-5.5.0"             "fix/run3-lexical-overmerge"
          do
            delete_api "git/refs/heads/$branch" "branch $branch"
          done

          for release_id in             "389555653"             "389545327"             "389495809"             "388097737"
          do
            delete_api "releases/$release_id" "release $release_id"
          done

          for tag in             "v5.4.1" "v5.4.2" "v5.4.3" "v5.4.4" "v5.4.5"             "v5.4.6" "v5.4.7" "v5.4.8" "v5.4.9" "v5.4.10"
          do
            delete_api "git/refs/tags/$tag" "tag $tag"
          done
