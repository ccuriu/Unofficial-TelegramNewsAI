name: One-time refresh clean v5.4.7 release

on:
  push:
    paths:
      - '.github/workflows/_one_time_refresh_v547.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Finalize clean repository state
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item -LiteralPath '.github/workflows/_one_time_refresh_v547.yml'
          git add -A
          git commit -m "chore: finalize public v5.4.7 release"
          git push origin HEAD:main
          "CLEAN_SHA=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Move v5.4.7 tag to clean source
        shell: pwsh
        run: |
          git tag -f v5.4.7 $env:CLEAN_SHA
          git push origin refs/tags/v5.4.7 --force

      - name: Build clean release files
        shell: pwsh
        run: |
          .\scripts\build_release.ps1 -OutputDirectory "$env:RUNNER_TEMP\release"

      - name: Replace release assets and notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'release\TelegramNewsAI-5.4.7-Stable-Windows.zip'
          $sha = Join-Path $env:RUNNER_TEMP 'release\TelegramNewsAI-5.4.7-Stable-Windows.sha256.txt'
          if (-not (Test-Path -LiteralPath $zip)) { throw "Release ZIP not found: $zip" }
          if (-not (Test-Path -LiteralPath $sha)) { throw "SHA-256 file not found: $sha" }

          gh release upload v5.4.7 $zip $sha --clobber

          $notes = @'
          ## TelegramNewsAI 5.4.7 Stable

          Актуальная стабильная Windows-версия на 14 сентября 2026 года.

          ### Что входит в первый публичный релиз

          - локальный сбор публикаций выбранных Telegram-каналов через Telethon;
          - история и поиск по SQLite FTS5;
          - догрузка пропущенных публикаций без необходимости держать программу постоянно запущенной;
          - сохранение редакций сообщений и схлопывание точных дублей;
          - структурированные JSON-выгрузки для анализа в ИИ-ассистентах;
          - прямые ссылки на исходные публикации публичных каналов, когда они доступны;
          - защищённое Windows DPAPI хранение Telegram API-данных;
          - Windows-установщик, локальные регрессионные тесты и автоматические проверки GitHub Actions.

          ### Последняя подготовка к публикации

          - примеры каналов в исходнике сделаны полностью нейтральными;
          - удалено частное правило, привязанное к конкретному Telegram-каналу;
          - README переработан как публичная страница проекта и дополнен схемой работы и статусными значками;
          - ZIP релиза пересобран непосредственно из актуального очищенного исходника.

          ### Установка

          Скачайте `TelegramNewsAI-5.4.7-Stable-Windows.zip`, проверьте SHA-256 по приложенному файлу, распакуйте архив в обычную папку и запустите `INSTALL.bat`.

          При первом запуске программа попросит собственные Telegram API ID, API Hash и номер телефона. Получить API ID и API Hash можно на `my.telegram.org` в разделе **API development tools**.
          '@
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          gh release edit v5.4.7 --title 'TelegramNewsAI 5.4.7 Stable' --notes-file $notesPath
