name: Refresh v5.5.0 standalone updater

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh_v550_updater.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified main CI artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release_files
          gh run download 36140495734 \
            --repo "$REPO" \
            --name "Unofficial-TelegramNewsAI-Windows-Build" \
            --dir release_files

      - name: Verify direct updater contract
        shell: bash
        run: |
          set -euo pipefail
          updater="release_files/TelegramNewsAI_Update.cmd"
          test -f "$updater"
          grep -Fq "/releases/latest" "$updater"
          grep -Fq "raw.githubusercontent.com" "$updater"
          grep -Fq "release_manifest.json" "$updater"
          grep -Fq "Программа в актуальном состоянии" "$updater"
          if grep -Fqi "Expand-Archive" "$updater"; then
            echo "Updater still contains archive extraction."
            exit 1
          fi
          if grep -Eqi '\\.zip([^-A-Za-z0-9_]|$)' "$updater"; then
            echo "Updater still references ZIP packages."
            exit 1
          fi
          sha256sum "$updater"

      - name: Replace only standalone updater in v5.5.0
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload v5.5.0 \
            --repo "$REPO" \
            release_files/TelegramNewsAI_Update.cmd \
            --clobber
