name: Align v5.4.7 tag once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/move-v5.4.7-tag-once.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Align release tag
        run: |
          git tag -f v5.4.7 35ed595b59e1aefd9c3cc1baaf201573d7ab67be
          git push origin --force refs/tags/v5.4.7

      - name: Verify tag
        run: |
          test "$(git ls-remote origin refs/tags/v5.4.7 | cut -f1)" = "35ed595b59e1aefd9c3cc1baaf201573d7ab67be"
