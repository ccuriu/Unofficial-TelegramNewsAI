name: Fix channel range selection once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-channel-range-selection-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Apply focused fix
        shell: pwsh
        run: |
          @'
          import textwrap
          from pathlib import Path

          def replace_block(text, start_marker, end_marker, replacement):
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'Start marker not found: {start_marker!r}')
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'End marker not found: {end_marker!r}')
              return text[:start] + replacement.rstrip() + '\n\n' + text[end:]

          source_path = Path('telegram_collector_free.py')
          text = source_path.read_text(encoding='utf-8')

          public_block = textwrap.dedent('''
          async def prompt_add_public_channels(client, items):
              print("\\nМожно добавить публичные каналы БЕЗ подписки.")
              print("Поддерживаются:")
              print("  @example_channel")
              print("  https://t.me/example_channel")
              print("  https://t.me/example_channel/12345")
              print("Несколько адресов — через запятую.")
              print(
                  "Если нужные подписанные каналы уже выбраны выше, "
                  "повторять их номера здесь не нужно."
              )
              print("Enter или 0 — Готово, продолжить без добавления.")

              raw = input(
                  "Введите публичный канал(ы) или нажмите Enter: "
              ).strip()

              if is_back_command(raw) or not raw:
                  print("Дополнительные публичные каналы не добавлялись.")
                  return items

              if looks_like_number_selection(raw):
                  print(
                      "Это похоже на номера из списка подписок. "
                      "Выбранные там каналы уже добавлены."
                  )
                  print(
                      "Здесь вводятся только @username или ссылки t.me. "
                      "Продолжаю без дополнительных каналов."
                  )
                  return items

              added = 0

              for part in raw.split(","):
                  part = part.strip()
                  if not part:
                      continue

                  try:
                      item = await resolve_public_channel(client, part)

                      if any(
                          int(x["id"]) == int(item["id"])
                          for x in items
                      ):
                          print(f"  Уже есть: {item['name']}")
                          continue

                      items.append(item)
                      added += 1

                      uname = item.get("username") or "без username"
                      print(f"  Добавлен: {item['name']} (@{uname})")

                  except Exception as e:
                      print(f"  Не добавлен {part}: {e}")

              items = dedupe_channel_items(items)

              if added:
                  save_selection(items)
                  print(f"Добавлено новых каналов: {added}")

              return items
          ''').strip()

          text = replace_block(
              text,
              'async def prompt_add_public_channels(client, items):\n',
              'def print_selected_channels(items):\n',
              public_block,
          )

          parser_block = textwrap.dedent(r'''
          def looks_like_number_selection(raw):
              compact = (raw or "").replace(" ", "")
              return bool(
                  re.fullmatch(
                      r"\d+(?:-\d+)?(?:,\d+(?:-\d+)?)*",
                      compact,
                  )
              )


          def parse_number_selection(raw, maximum):
              selected = set()
              raw = (raw or "").replace(" ", "")

              if not raw:
                  return selected

              if maximum < 1:
                  raise ValueError("Список каналов пуст.")

              for part in raw.split(","):
                  if not part:
                      raise ValueError("Обнаружен пустой номер.")

                  if "-" in part:
                      if part.count("-") != 1:
                          raise ValueError(f"Некорректный диапазон: {part}")

                      a_text, b_text = part.split("-", 1)
                      if not a_text.isdigit() or not b_text.isdigit():
                          raise ValueError(f"Некорректный диапазон: {part}")

                      a, b = int(a_text), int(b_text)
                      if not (1 <= a <= maximum and 1 <= b <= maximum):
                          raise ValueError(
                              f"Диапазон {part} выходит за пределы списка 1-{maximum}."
                          )

                      selected.update(
                          range(min(a, b), max(a, b) + 1)
                      )
                  else:
                      if not part.isdigit():
                          raise ValueError(f"Некорректный номер: {part}")

                      n = int(part)
                      if not 1 <= n <= maximum:
                          raise ValueError(
                              f"Номер {n} вне списка 1-{maximum}."
                          )
                      selected.add(n)

              return selected
          ''').strip()

          text = replace_block(
              text,
              'def parse_number_selection(raw, maximum):\n',
              'def prompt_remove_channels(items):\n',
              parser_block,
          )

          select_block = textwrap.dedent('''
          async def select_from_subscriptions(client, subscribed):
              print("\\nВаши подписанные каналы:")

              for i, dialog in enumerate(subscribed, 1):
                  username = getattr(
                      dialog.entity,
                      "username",
                      None,
                  )
                  suffix = f" @{username}" if username else ""
                  print(f"{i:>4}. {dialog.name}{suffix}")

              print("\\nВведите номера через запятую; диапазоны — через дефис.")
              print("Пример: 1,3,7-12")
              print("Можно написать all.")
              print("0 — Назад (сохранить прежний список).")

              while True:
                  raw = input("Выбор: ").strip().lower()

                  if is_back_command(raw):
                      print("Создание нового списка отменено.")
                      return None

                  if raw == "all":
                      selected_nums = set(
                          range(1, len(subscribed) + 1)
                      )
                  else:
                      try:
                          selected_nums = parse_number_selection(
                              raw,
                              len(subscribed),
                          )
                      except Exception as e:
                          print(f"Не удалось разобрать выбор: {e}")
                          print("Введите номера ещё раз или 0 для выхода.")
                          continue

                  if not selected_nums:
                      print("Ни одного канала не выбрано.")
                      print("Введите номера ещё раз или 0 для выхода.")
                      continue

                  break

              items = [
                  channel_item(
                      subscribed[i - 1].entity,
                      subscribed[i - 1].name,
                  )
                  for i in sorted(selected_nums)
              ]

              print(f"\\nВыбрано подписанных каналов: {len(items)}")
              if len(items) <= 20:
                  for item in items:
                      username = item.get("username")
                      suffix = f" @{username}" if username else ""
                      print(f"  + {item['name']}{suffix}")
              else:
                  print(
                      "Номера приняты. Список большой, "
                      "поэтому названия не дублируются."
                  )

              print(
                  "Эти каналы уже включены в новый список. "
                  "Следующий шаг — только необязательное добавление "
                  "публичных каналов без подписки."
              )

              # Сохраняем подтверждённый выбор до необязательного второго шага.
              save_selection(items)

              items = await prompt_add_public_channels(
                  client,
                  items,
              )

              items = dedupe_channel_items(items)
              save_selection(items)
              return items
          ''').strip()

          text = replace_block(
              text,
              'async def select_from_subscriptions(client, subscribed):\n',
              'async def resolve_channels(\n',
              select_block,
          )

          source_path.write_text(text, encoding='utf-8')

          tests_path = Path('tests/test_regressions.py')
          tests = tests_path.read_text(encoding='utf-8')
          if 'def test_channel_number_range_selects_every_number' not in tests:
              anchor = '    def test_numbers_are_not_near_duplicates(self):\n'
              if anchor not in tests:
                  raise SystemExit('Test insertion anchor not found')

              addition = '''    def test_channel_number_range_selects_every_number(self):
                  self.assertEqual(
                      collector.parse_number_selection("30-33", 40),
                      {30, 31, 32, 33},
                  )

              def test_channel_number_range_rejects_out_of_bounds(self):
                  with self.assertRaisesRegex(ValueError, "1-32"):
                      collector.parse_number_selection("30-33", 32)

              def test_public_channel_prompt_does_not_reparse_number_range(self):
                  existing = [
                      {"id": 30, "name": "Thirty", "username": "thirty"},
                      {"id": 31, "name": "Thirty One", "username": "thirty_one"},
                  ]

                  with patch("builtins.input", return_value="30-33"):
                      with patch.object(
                          collector,
                          "resolve_public_channel",
                      ) as mocked_resolve:
                          with patch("builtins.print") as mocked_print:
                              result = asyncio.run(
                                  collector.prompt_add_public_channels(
                                      object(),
                                      list(existing),
                                  )
                              )

                  self.assertEqual(result, existing)
                  mocked_resolve.assert_not_awaited()
                  printed = " ".join(
                      str(argument)
                      for call in mocked_print.call_args_list
                      for argument in call.args
                  )
                  self.assertIn("номера из списка подписок", printed)
                  self.assertIn("уже добавлены", printed)

          '''
              tests = tests.replace(anchor, addition + anchor, 1)
              tests_path.write_text(tests, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          note = (
              'При создании нового списка номера и диапазоны, например `30-33`, относятся к показанному списку подписок. '
              'После подтверждения эти каналы уже выбраны. На следующем необязательном шаге вводятся только '
              '`@username` или ссылки `t.me`; если добавлять такие каналы не нужно, нажмите `Enter` или `0`.\n\n'
          )
          marker = 'Во всех вложенных запросах `0` отменяет незавершённый ввод и возвращает в главное меню без изменения сохранённого списка каналов.\n'
          if note not in readme and marker in readme:
              readme = readme.replace(marker, marker + '\n' + note, 1)
              readme_path.write_text(readme, encoding='utf-8')
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP\patch.py" -Encoding utf8
          python "$env:RUNNER_TEMP\patch.py"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile-check
        run: python -m py_compile telegram_collector_free.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram_collector_free.py tests/test_regressions.py README.md
          git diff --cached --check
          if (git diff --cached --quiet) { throw 'Fix produced no changes.' }
          git commit -m "fix: clarify and validate channel range selection"
          git push
