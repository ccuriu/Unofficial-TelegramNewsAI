name: Fix API Hash input once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-api-hash-input-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Apply focused hotfix
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          source_path = Path('telegram_collector_free.py')
          text = source_path.read_text(encoding='utf-8')

          old_import = 'from telethon.errors import FloodWaitError'
          new_import = 'from telethon.errors import ApiIdInvalidError, FloodWaitError'
          if old_import not in text:
              raise SystemExit('Telethon error import anchor not found')
          text = text.replace(old_import, new_import, 1)

          old_helpers = '''def prompt_telegram_password():
              print("\\nTelegram запросил пароль двухэтапной защиты.")
              print(
                  "Ввод скрыт: символы на экране не отображаются — это нормально."
              )
              return getpass(
                  "Введите или вставьте пароль и нажмите Enter: "
              )


          def load_or_create_credentials():
          '''.replace('          ', '')

          new_helpers = '''def prompt_telegram_password():
              print("\\nTelegram запросил пароль двухэтапной защиты.")
              print(
                  "Ввод скрыт: символы на экране не отображаются — это нормально."
              )
              return getpass(
                  "Введите или вставьте пароль и нажмите Enter: "
              )


          def is_valid_api_hash(value):
              return bool(re.fullmatch(r"[0-9a-fA-F]{32}", str(value or "").strip()))


          def prompt_api_hash():
              print(
                  "\\nAPI Hash вводится скрыто: "
                  "символы на экране не отображаются — это нормально."
              )
              print(
                  "Если обычная вставка в скрытое поле работает неправильно, "
                  "используйте Shift+Insert или правую кнопку мыши."
              )
              while True:
                  api_hash = getpass(
                      "Введите или вставьте API Hash и нажмите Enter: "
                  ).strip()
                  if is_valid_api_hash(api_hash):
                      return api_hash
                  print(
                      f"API Hash введён некорректно: получено {len(api_hash)} символов, "
                      "ожидается 32 символа 0-9/a-f."
                  )
                  if len(api_hash) <= 1:
                      print(
                          "Похоже, сочетание клавиш вставило управляющий символ вместо текста. "
                          "Попробуйте Shift+Insert или правую кнопку мыши."
                      )


          def save_credentials(data):
              CRED_FILE.write_bytes(
                  dpapi_encrypt(
                      json.dumps(data, ensure_ascii=False).encode("utf-8")
                  )
              )


          def load_or_create_credentials():
          '''.replace('          ', '')

          if old_helpers not in text:
              raise SystemExit('Credential helper anchor not found')
          text = text.replace(old_helpers, new_helpers, 1)

          old_prompt = '''    api_id_text = input("Введите API ID: ").strip()
              if not api_id_text.isdigit():
                  raise ValueError("API ID должен состоять из цифр.")

              print(
                  "\\nAPI Hash вводится скрыто: "
                  "символы на экране не отображаются — это нормально."
              )
              api_hash = getpass(
                  "Введите или вставьте API Hash и нажмите Enter: "
              ).strip()
              phone = input(
                  "\\nВведите номер Telegram в международном формате, "
                  "например +380...: "
              ).strip()

              data = {
                  "api_id": int(api_id_text),
                  "api_hash": api_hash,
                  "phone": phone,
              }

              CRED_FILE.write_bytes(
                  dpapi_encrypt(
                      json.dumps(data, ensure_ascii=False).encode("utf-8")
                  )
              )
              return data
          '''.replace('              ', '    ')

          new_prompt = '''    while True:
              api_id_text = input("Введите API ID: ").strip()
              if api_id_text.isdigit() and int(api_id_text) > 0:
                  break
              print("API ID должен состоять из цифр. Попробуйте ещё раз.")

              api_hash = prompt_api_hash()
              phone = input(
                  "\\nВведите номер Telegram в международном формате, "
                  "например +380...: "
              ).strip()

              return {
                  "api_id": int(api_id_text),
                  "api_hash": api_hash,
                  "phone": phone,
              }
          '''.replace('              ', '    ')

          if old_prompt not in text:
              raise SystemExit('Credential prompt anchor not found')
          text = text.replace(old_prompt, new_prompt, 1)

          old_client = '''async def ensure_telegram_client(client, creds, settings=None):
              """
              Подключается к Telegram только когда это действительно нужно.
              Поиск по локальной news.db может работать вообще без Telegram.
              """
              if client is not None:
                  try:
                      if client.is_connected():
                          return client, creds
                  except Exception:
                      pass

              if creds is None:
                  creds = load_or_create_credentials()

              flood_sleep_threshold = max(
                  0,
                  min(
                      86400,
                      int((settings or DEFAULT_SETTINGS).get("telethon_flood_sleep_threshold_seconds", 60)),
                  ),
              )

              client = TelegramClient(
                  SESSION_FILE,
                  creds["api_id"],
                  creds["api_hash"],
                  flood_sleep_threshold=flood_sleep_threshold,
              )

              print("\\nПодключение к Telegram...")
              await client.start(
                  phone=creds["phone"],
                  code_callback=prompt_telegram_code,
                  password=prompt_telegram_password,
              )
              print(
                  "Telegram успешно подключён. "
                  "Сессия сохранена — повторный ввод обычно не потребуется."
              )

              return client, creds
          '''.replace('              ', '    ')

          new_client = '''async def ensure_telegram_client(client, creds, settings=None):
              """
              Подключается к Telegram только когда это действительно нужно.
              Поиск по локальной news.db может работать вообще без Telegram.
              """
              if client is not None:
                  try:
                      if client.is_connected():
                          return client, creds
                  except Exception:
                      pass

              flood_sleep_threshold = max(
                  0,
                  min(
                      86400,
                      int((settings or DEFAULT_SETTINGS).get("telethon_flood_sleep_threshold_seconds", 60)),
                  ),
              )

              while True:
                  if creds is None:
                      creds = load_or_create_credentials()

                  candidate = TelegramClient(
                      SESSION_FILE,
                      creds["api_id"],
                      creds["api_hash"],
                      flood_sleep_threshold=flood_sleep_threshold,
                  )

                  print("\\nПодключение к Telegram...")
                  try:
                      await candidate.start(
                          phone=creds["phone"],
                          code_callback=prompt_telegram_code,
                          password=prompt_telegram_password,
                      )
                  except ApiIdInvalidError:
                      try:
                          await candidate.disconnect()
                      except Exception:
                          pass
                      try:
                          if CRED_FILE.exists():
                              CRED_FILE.unlink()
                      except Exception:
                          pass
                      print(
                          "\\nTelegram отклонил API ID / API Hash. "
                          "Проверьте значения на https://my.telegram.org → API development tools."
                      )
                      print(
                          "Неверные данные не сохранены. Введите API ID и API Hash заново."
                      )
                      creds = None
                      client = None
                      continue

                  save_credentials(creds)
                  print(
                      "Telegram успешно подключён. "
                      "Сессия сохранена — повторный ввод обычно не потребуется."
                  )
                  return candidate, creds
          '''.replace('              ', '    ')

          if old_client not in text:
              raise SystemExit('Telegram client anchor not found')
          text = text.replace(old_client, new_client, 1)
          source_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_regressions.py')
          tests = test_path.read_text(encoding='utf-8')
          anchor = '''    def test_telegram_password_prompt_explains_hidden_input(self):\n'''
          if anchor not in tests:
              raise SystemExit('Test insertion anchor not found')
          addition = '''    def test_api_hash_validation_requires_32_hex_characters(self):
              self.assertTrue(collector.is_valid_api_hash("a" * 32))
              self.assertTrue(collector.is_valid_api_hash("0123456789abcdef0123456789ABCDEF"))
              self.assertFalse(collector.is_valid_api_hash("a" * 31))
              self.assertFalse(collector.is_valid_api_hash("\\x16"))
              self.assertFalse(collector.is_valid_api_hash("g" * 32))

              def test_api_hash_prompt_retries_after_bad_hidden_paste(self):
                  with patch.object(
                      collector,
                      "getpass",
                      side_effect=["\\x16", "a" * 32],
                  ) as mocked_getpass:
                      with patch("builtins.print") as mocked_print:
                          self.assertEqual(collector.prompt_api_hash(), "a" * 32)
                  self.assertEqual(mocked_getpass.call_count, 2)
                  printed = " ".join(
                      str(argument)
                      for call in mocked_print.call_args_list
                      for argument in call.args
                  )
                  self.assertIn("получено 1 символов", printed)
                  self.assertIn("Shift+Insert", printed)

          '''.replace('              ', '    ')
          tests = tests.replace(anchor, addition + anchor, 1)
          test_path.write_text(tests, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          marker = '**Не публикуйте API Hash и не отправляйте его посторонним.**'
          note = ('Для скрытого поля API Hash программа проверяет формат до подключения. '
                  'Если вставка сочетанием клавиш в консоли сработала неправильно, используйте `Shift+Insert` '
                  'или правую кнопку мыши — корректный API Hash содержит 32 шестнадцатеричных символа.\\n\\n')
          if note not in readme:
              if marker not in readme:
                  raise SystemExit('README API Hash marker not found')
              readme = readme.replace(marker, note + marker, 1)
              readme_path.write_text(readme, encoding='utf-8')
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP\patch.py" -Encoding utf8
          python "$env:RUNNER_TEMP\patch.py"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile-check
        run: python -m py_compile telegram_collector_free.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Commit hotfix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram_collector_free.py tests/test_regressions.py README.md
          git diff --cached --check
          if (git diff --cached --quiet) { throw 'Hotfix produced no changes.' }
          git commit -m "fix: validate hidden Telegram API Hash input"
          git push
