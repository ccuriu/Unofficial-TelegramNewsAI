name: Refresh v5.4.7 channel fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-v5.4.7-channel-fix-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout verified source
        uses: actions/checkout@v7
        with:
          ref: 1af186abe242c5d02e150d1cf0533dac2ce010ab

      - name: Build clean Windows release
        shell: pwsh
        run: |
          .\scripts\build_release.ps1 -OutputDirectory "$env:RUNNER_TEMP\release"

      - name: Verify exact ZIP contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Join-Path $env:RUNNER_TEMP 'release\TelegramNewsAI-5.4.7-Stable-Windows.zip'
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $prefix = 'TelegramNewsAI-5.4.7-Stable-Windows/'
            $actual = @($archive.Entries | Where-Object { $_.Name } | ForEach-Object {
              $name = $_.FullName -replace '\\', '/'
              if (-not $name.StartsWith($prefix, [StringComparison]::Ordinal)) { throw "Unexpected ZIP root: $name" }
              $name.Substring($prefix.Length)
            } | Sort-Object)
          }
          finally { $archive.Dispose() }
          $expected = @(
            'INSTALL.bat', 'LICENSE', 'README.md', 'SECURITY.md',
            'Telegram_Digest.exe', 'Telegram_Digest.exe.sha256', 'install.ps1',
            'requirements.txt', 'run_python.bat', 'start_free.bat',
            'telegram_collector_free.py'
          ) | Sort-Object
          if (@(Compare-Object $expected $actual).Count) { throw 'Release ZIP contents differ from whitelist.' }

      - name: Replace v5.4.7 assets and notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'release\TelegramNewsAI-5.4.7-Stable-Windows.zip'
          $sum = Join-Path $env:RUNNER_TEMP 'release\TelegramNewsAI-5.4.7-Stable-Windows.sha256.txt'
          gh release upload v5.4.7 $zip $sum --repo $env:GITHUB_REPOSITORY --clobber

          $notes = @'
          ## TelegramNewsAI 5.4.7 Stable

          Актуальная стабильная Windows-версия. Релиз обновлён 15 сентября 2026 года после проверки первого запуска и выбора каналов.

          ### Исправления первого запуска

          - API Hash проверяется до подключения: принимаются только 32 шестнадцатеричных символа;
          - если скрытая вставка API Hash сработала неправильно, программа объясняет причину и предлагает повторный ввод;
          - неверные API ID / API Hash не сохраняются до успешного подключения.

          ### Исправление выбора каналов

          - диапазон вроде `30-33` корректно выбирает каналы 30, 31, 32 и 33 из списка подписок;
          - после выбора программа явно показывает, сколько подписанных каналов выбрано, и подтверждает их включение в новый список;
          - следующий экран теперь отдельно обозначен как необязательное добавление публичных каналов по `@username` или ссылке `t.me`;
          - если на втором экране снова ввести `30-33`, программа больше не пытается распознать это как адрес Telegram, а объясняет, что номера уже были выбраны;
          - диапазон, выходящий за пределы списка, не обрезается молча: программа сообщает об ошибке и просит повторить ввод.

          ### Возможности

          - локальный сбор публикаций выбранных Telegram-каналов через Telethon;
          - история и поиск по SQLite FTS5;
          - догрузка пропущенных публикаций;
          - структурированные JSON-файлы для анализа в ИИ-ассистентах;
          - прямые ссылки на исходные публикации публичных каналов, когда они доступны;
          - защищённое Windows DPAPI хранение Telegram API-данных.

          ### Установка

          Скачайте `TelegramNewsAI-5.4.7-Stable-Windows.zip`, проверьте SHA-256 по приложенному файлу, распакуйте архив в обычную папку и запустите `INSTALL.bat`.
          '@
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          gh release edit v5.4.7 --repo $env:GITHUB_REPOSITORY --title 'TelegramNewsAI 5.4.7 Stable' --notes-file $notesPath --latest

      - name: Verify release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v5.4.7" | ConvertFrom-Json
          $assets = @($release.assets | ForEach-Object { $_.name } | Sort-Object)
          $expected = @('TelegramNewsAI-5.4.7-Stable-Windows.sha256.txt','TelegramNewsAI-5.4.7-Stable-Windows.zip') | Sort-Object
          if (@(Compare-Object $expected $assets).Count) { throw 'Unexpected release assets.' }
          if ($release.body -notmatch 'диапазон вроде') { throw 'Release notes were not updated.' }
