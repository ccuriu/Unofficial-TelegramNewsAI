name: One-time neutralize channel traces

on:
  push:
    paths:
      - '.github/workflows/_one_time_neutralize_channels.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply only the intended source edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('telegram_collector_free.py')
          text = path.read_text(encoding='utf-8')

          real = 'true' + 'xanewsua'
          old_block = (
              f'    print("  @{real}")\n'
              f'    print("  https://t.me/{real}")\n'
              f'    print("  https://t.me/{real}/12345")\n'
          )
          new_block = (
              '    print("  @example_channel")\n'
              '    print("  https://t.me/example_channel")\n'
              '    print("  https://t.me/example_channel/12345")\n'
          )

          if text.count(old_block) != 1:
              raise SystemExit('Expected channel example block was not found exactly once')
          text = text.replace(old_block, new_block, 1)

          brand = 'тру' + 'ха'
          special_line = f'    r"^\\s*{brand}.*надіслати новину\\s*$",\n'
          if text.count(special_line) != 1:
              raise SystemExit('Expected channel-specific promo rule was not found exactly once')
          text = text.replace(special_line, '', 1)

          path.write_text(text, encoding='utf-8')
          PY

          python -m py_compile telegram_collector_free.py
          git diff --check

          rm .github/workflows/_one_time_neutralize_channels.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram_collector_free.py .github/workflows/_one_time_neutralize_channels.yml
          git commit -m "Neutralize channel-specific traces without unrelated changes"
          git push origin HEAD:main
