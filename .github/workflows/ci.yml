name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile-check collector
        run: python -m py_compile telegram_collector_free.py

      - name: Verify Telethon import
        run: python -c "import telethon; print('Telethon', telethon.__version__)"

      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v

      - name: Ensure local data is not tracked
        shell: pwsh
        run: |
          $pattern = '(^|/)(credentials(?:\.unreadable-[^/]*)?\.bin|[^/]*\.session(?:-journal)?|news\.db(?:-[^/]*)?|settings_free\.json|selected_channels\.json|collector\.lock)$|(^|/)(Дайджесты|logs|Резервные_копии|Релизы|models|\.venv(?:\.unsupported-[^/]*)?|\.test-venv|__pycache__)/'
          $forbidden = @(git ls-files | Where-Object { $_ -match $pattern })
          if ($forbidden.Count) {
            $forbidden | ForEach-Object { Write-Error "Tracked local data: $_" }
            exit 1
          }

      - name: Validate PowerShell scripts
        shell: powershell
        run: |
          foreach ($path in @('.\install.ps1', '.\update.ps1', '.\scripts\build_release.ps1', '.\launcher\build_launcher.ps1', '.\launcher\build_icon.ps1')) {
            $text = Get-Content -LiteralPath $path -Raw
            [void][ScriptBlock]::Create($text)
          }

      - name: Verify launcher checksum and self-test
        shell: pwsh
        run: |
          $expected = ((Get-Content .\Telegram_Digest.exe.sha256 -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash .\Telegram_Digest.exe -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'Telegram_Digest.exe checksum mismatch.' }
          $process = Start-Process .\Telegram_Digest.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Launcher self-test failed: $($process.ExitCode)" }

      - name: Compile and self-test launcher source
        shell: powershell
        run: |
          $launcherDir = Join-Path $env:RUNNER_TEMP 'launcher-self-test'
          New-Item -ItemType Directory -Path $launcherDir -Force | Out-Null
          Copy-Item .\start_free.bat (Join-Path $launcherDir 'start_free.bat') -Force
          $compiled = Join-Path $launcherDir 'Telegram_Digest.exe'
          .\launcher\build_launcher.ps1 -OutputPath $compiled
          $process = Start-Process $compiled -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Compiled launcher self-test failed: $($process.ExitCode)" }

      - name: Build clean release candidate
        shell: powershell
        run: |
          .\scripts\build_release.ps1 -OutputDirectory "$env:RUNNER_TEMP\release"

      - name: Verify clean install from release candidate
        shell: powershell
        run: |
          $packages = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\release" -Directory)
          if ($packages.Count -ne 1) { throw "Expected exactly one release package directory, found $($packages.Count)." }
          $package = $packages[0].FullName
          $installer = Join-Path $package 'install.ps1'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $installer -NoShortcut
          if ($LASTEXITCODE -ne 0) { throw "Clean install failed: $LASTEXITCODE" }

          $venvPython = Join-Path $package '.venv\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $venvPython -PathType Leaf)) {
            throw 'Clean install did not create .venv.'
          }
          & $venvPython -c "import telethon; print('Installed Telethon', telethon.__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'Installed Telethon import failed.' }
          & $venvPython -m py_compile (Join-Path $package 'telegram_collector_free.py')
          if ($LASTEXITCODE -ne 0) { throw 'Installed collector compile-check failed.' }

          $launcher = Join-Path $package 'Telegram_Digest.exe'
          $process = Start-Process $launcher -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installed launcher self-test failed: $($process.ExitCode)" }

          $version = (Select-String -LiteralPath (Join-Path $package 'telegram_collector_free.py') -Pattern '^APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($version -ne '5.4.17 Testing') { throw "Unexpected installed collector version: $version" }
          $versionInfo = (Get-Item -LiteralPath $launcher).VersionInfo
          if ($versionInfo.FileVersion -ne '5.4.17.0') { throw "Unexpected launcher file version: $($versionInfo.FileVersion)" }
          if ($versionInfo.FileDescription -notlike '*5.4.17 Testing*') { throw "Unexpected launcher description: $($versionInfo.FileDescription)" }

          foreach ($relative in @(
            'credentials.bin',
            'telegram_session.session',
            'selected_channels.json',
            'settings_free.json',
            'news.db',
            'Дайджесты',
            'logs',
            'Резервные_копии'
          )) {
            if (Test-Path -LiteralPath (Join-Path $package $relative)) {
              throw "Fresh installation unexpectedly contains user state: $relative"
            }
          }

      - name: Verify exact release ZIP contents
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zips = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\release" -Filter '*.zip' -File)
          if ($zips.Count -ne 1) { throw "Expected exactly one release ZIP, found $($zips.Count)." }
          $archive = [IO.Compression.ZipFile]::OpenRead($zips[0].FullName)
          try {
            $prefix = [IO.Path]::GetFileNameWithoutExtension($zips[0].Name) + '/'
            $actual = @($archive.Entries | Where-Object { $_.Name } | ForEach-Object {
              $name = $_.FullName -replace '\\', '/'
              if (-not $name.StartsWith($prefix, [StringComparison]::Ordinal)) {
                throw "Unexpected ZIP root: $name"
              }
              $name.Substring($prefix.Length)
            } | Sort-Object)
          }
          finally {
            $archive.Dispose()
          }
          $manifest = Get-Content .\release_manifest.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $expected = @($manifest.ProgramFiles | ForEach-Object { $_ -replace '\\', '/' } | Sort-Object)
          $difference = @(Compare-Object -ReferenceObject $expected -DifferenceObject $actual)
          if ($difference.Count) {
            $difference | Format-Table | Out-String | Write-Error
            throw 'Release ZIP does not match release_manifest.json.'
          }
          if ($actual.Count -ne $expected.Count) { throw "Expected $($expected.Count) files, found $($actual.Count)." }

      - name: Upload verified release files
        uses: actions/upload-artifact@v7
        with:
          name: Unofficial-TelegramNewsAI-Windows-Build
          path: |
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/*.sha256.txt
          if-no-files-found: error
          retention-days: 30
