name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile-check collector
        run: python -m py_compile telegram_collector_free.py

      - name: Verify Telethon import
        run: python -c "import telethon; print('Telethon', telethon.__version__)"

      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v

      - name: Ensure local data is not tracked
        shell: pwsh
        run: |
          $pattern = '(^|/)(credentials(?:\.unreadable-[^/]*)?\.bin|[^/]*\.session(?:-journal)?|news\.db(?:-[^/]*)?|settings_free\.json|selected_channels\.json|collector\.lock)$|(^|/)(Дайджесты|logs|Резервные_копии|Релизы|models|\.venv(?:\.unsupported-[^/]*)?|\.test-venv|__pycache__)/'
          $forbidden = @(git ls-files | Where-Object { $_ -match $pattern })
          if ($forbidden.Count) {
            $forbidden | ForEach-Object { Write-Error "Tracked local data: $_" }
            exit 1
          }

      - name: Validate PowerShell scripts
        shell: powershell
        run: |
          foreach ($path in @('.\install.ps1', '.\scripts\build_release.ps1', '.\launcher\build_launcher.ps1')) {
            $text = Get-Content -LiteralPath $path -Raw
            [void][ScriptBlock]::Create($text)
          }

      - name: Verify launcher checksum and self-test
        shell: pwsh
        run: |
          $expected = ((Get-Content .\Telegram_Digest.exe.sha256 -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash .\Telegram_Digest.exe -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'Telegram_Digest.exe checksum mismatch.' }
          $process = Start-Process .\Telegram_Digest.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Launcher self-test failed: $($process.ExitCode)" }

      - name: Compile launcher source
        shell: powershell
        run: |
          .\launcher\build_launcher.ps1 -OutputPath "$env:RUNNER_TEMP\Telegram_Digest.exe"

      - name: Build clean release candidate
        shell: powershell
        run: |
          .\scripts\build_release.ps1 -OutputDirectory "$env:RUNNER_TEMP\release"

      - name: Verify exact release ZIP contents
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zips = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\release" -Filter '*.zip' -File)
          if ($zips.Count -ne 1) { throw "Expected exactly one release ZIP, found $($zips.Count)." }
          $archive = [IO.Compression.ZipFile]::OpenRead($zips[0].FullName)
          try {
            $prefix = [IO.Path]::GetFileNameWithoutExtension($zips[0].Name) + '/'
            $actual = @($archive.Entries | Where-Object { $_.Name } | ForEach-Object {
              $name = $_.FullName -replace '\\', '/'
              if (-not $name.StartsWith($prefix, [StringComparison]::Ordinal)) {
                throw "Unexpected ZIP root: $name"
              }
              $name.Substring($prefix.Length)
            } | Sort-Object)
          }
          finally {
            $archive.Dispose()
          }
          $expected = @(
            'INSTALL.bat', 'LICENSE', 'README.md', 'SECURITY.md',
            'Telegram_Digest.exe', 'Telegram_Digest.exe.sha256', 'install.ps1',
            'requirements.txt', 'run_python.bat', 'start_free.bat',
            'telegram_collector_free.py'
          ) | Sort-Object
          $difference = @(Compare-Object -ReferenceObject $expected -DifferenceObject $actual)
          if ($difference.Count) {
            $difference | Format-Table | Out-String | Write-Error
            throw 'Release ZIP does not match the exact whitelist.'
          }
          if ($actual.Count -ne 11) { throw "Expected 11 files, found $($actual.Count)." }

      - name: Upload verified release files
        uses: actions/upload-artifact@v7
        with:
          name: TelegramNewsAI-Stable-Windows
          path: |
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/*.sha256.txt
          if-no-files-found: error
          retention-days: 30
