name: Publish v5.5.0 quick-start PDF

on:
  push:
    branches: [main]
    paths:
      - 'tools/build_quick_start_pdf.py'
      - '.github/workflows/publish_v550_quick_start_pdf.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install --disable-pip-version-check reportlab
          python tools/build_quick_start_pdf.py

      - name: Publish PDF to v5.5.0 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v5.5.0 Unofficial-TelegramNewsAI-5.5.0-Quick-Start.pdf --clobber
