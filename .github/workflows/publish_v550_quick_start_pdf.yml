name: Publish v5.5.0 quick-start PDF

on:
  push:
    branches: [main]
    paths:
      - 'docs/Unofficial-TelegramNewsAI-5.5.0-Quick-Start.pdf'
      - '.github/workflows/publish_v550_quick_start_pdf.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish PDF to v5.5.0 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v5.5.0 docs/Unofficial-TelegramNewsAI-5.5.0-Quick-Start.pdf --clobber
