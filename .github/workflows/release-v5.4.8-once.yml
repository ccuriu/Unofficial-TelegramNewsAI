name: Release v5.4.8 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v5.4.8-once.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout verified clean source
        uses: actions/checkout@v7
        with:
          ref: 892703b2bc6c5181d79ad29ad2fc473f6d2e6ddb

      - name: Build clean Windows release
        shell: pwsh
        run: .\scripts\build_release.ps1 -OutputDirectory "$env:RUNNER_TEMP\release"

      - name: Verify exact ZIP contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Join-Path $env:RUNNER_TEMP 'release\TelegramNewsAI-5.4.8-Stable-Windows.zip'
          if (-not (Test-Path $zip)) { throw '5.4.8 ZIP missing.' }
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $prefix = 'TelegramNewsAI-5.4.8-Stable-Windows/'
            $actual = @($archive.Entries | Where-Object { $_.Name } | ForEach-Object {
              $name = $_.FullName -replace '\\', '/'
              if (-not $name.StartsWith($prefix, [StringComparison]::Ordinal)) { throw "Unexpected ZIP root: $name" }
              $name.Substring($prefix.Length)
            } | Sort-Object)
          }
          finally { $archive.Dispose() }
          $expected = @(
            'INSTALL.bat', 'LICENSE', 'README.md', 'SECURITY.md',
            'Telegram_Digest.exe', 'Telegram_Digest.exe.sha256', 'install.ps1',
            'requirements.txt', 'run_python.bat', 'start_free.bat',
            'telegram_collector_free.py'
          ) | Sort-Object
          if (@(Compare-Object $expected $actual).Count) { throw 'Release ZIP contents differ from whitelist.' }
          if ($actual.Count -ne 11) { throw "Expected 11 files, found $($actual.Count)." }

      - name: Create v5.4.8 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'release\TelegramNewsAI-5.4.8-Stable-Windows.zip'
          $sum = Join-Path $env:RUNNER_TEMP 'release\TelegramNewsAI-5.4.8-Stable-Windows.sha256.txt'
          $notes = @'
          ## TelegramNewsAI 5.4.8 Stable

          Стабильное обновление, улучшающее работу с Telegram-сессией и управление каналами.

          ### Что исправлено

          - добавлена глобальная защита от одновременного запуска двух копий TelegramNewsAI в одной Windows-сессии, даже если программы находятся в разных папках;
          - это снижает риск конфликтующих подключений к одной Telegram-сессии и ошибок вида `wrong session ID`;
          - команда `A` больше не загружает весь список подписок только ради добавления публичного канала — Telegram запрашивается только для указанного канала;
          - команды `R` и `L` работают полностью локально и не подключаются к Telegram;
          - технические сетевые предупреждения Telethon сохраняются в `logs`, а не засоряют обычное меню, если библиотека сама восстанавливает соединение;
          - сохранены исправления 5.4.7 для проверки API Hash и понятного выбора диапазонов каналов.

          ### Установка

          Скачайте `TelegramNewsAI-5.4.8-Stable-Windows.zip`, при желании сверьте SHA-256 с приложенным `.sha256.txt`, распакуйте архив и запустите `INSTALL.bat`.
          '@
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          gh release create v5.4.8 $zip $sum --repo $env:GITHUB_REPOSITORY --target 892703b2bc6c5181d79ad29ad2fc473f6d2e6ddb --title 'TelegramNewsAI 5.4.8 Stable' --notes-file $notesPath --latest

      - name: Verify release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v5.4.8" | ConvertFrom-Json
          if ($release.draft -or $release.prerelease) { throw 'v5.4.8 must be a stable release.' }
          $assets = @($release.assets | ForEach-Object { $_.name } | Sort-Object)
          $expected = @('TelegramNewsAI-5.4.8-Stable-Windows.sha256.txt','TelegramNewsAI-5.4.8-Stable-Windows.zip') | Sort-Object
          if (@(Compare-Object $expected $assets).Count) { throw 'Unexpected v5.4.8 release assets.' }
          if ($release.body -notmatch 'wrong session ID') { throw 'Release notes are incomplete.' }
