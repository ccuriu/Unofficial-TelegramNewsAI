name: Fix mixed channel input once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mixed-channel-input-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Apply focused mixed-input fix
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from textwrap import dedent, indent

          source_path = Path('telegram_collector_free.py')
          text = source_path.read_text(encoding='utf-8')

          old_version = 'APP_VERSION = "5.4.8 Stable"'
          if old_version not in text:
              raise SystemExit('APP_VERSION anchor not found')
          text = text.replace(old_version, 'APP_VERSION = "5.4.9 Stable"', 1)

          mixed_helper = dedent('''\
          def parse_mixed_channel_selection(raw, maximum):
              """Разбирает одну строку с номерами/диапазонами и Telegram-адресами."""
              selected = set()
              public_values = []
              raw = str(raw or "").strip()

              if not raw:
                  return selected, public_values

              for part in raw.split(","):
                  part = part.strip()
                  if not part:
                      raise ValueError("Обнаружен пустой элемент выбора.")

                  if part.casefold() == "all":
                      if maximum < 1:
                          raise ValueError("Список подписанных каналов пуст.")
                      selected.update(range(1, maximum + 1))
                      continue

                  compact = part.replace(" ", "")
                  if re.fullmatch(r"\\d+(?:-\\d+)?", compact):
                      selected.update(
                          parse_number_selection(compact, maximum)
                      )
                      continue

                  if normalize_public_channel_input(part):
                      public_values.append(part)
                      continue

                  raise ValueError(
                      f"Не удалось распознать элемент: {part}"
                  )

              return selected, unique_keep_order(public_values)


          ''')

          helper_anchor = '\ndef prompt_remove_channels(items):\n'
          if helper_anchor not in text:
              raise SystemExit('prompt_remove_channels anchor not found')
          if 'def parse_mixed_channel_selection(' not in text:
              text = text.replace(
                  helper_anchor,
                  '\n' + mixed_helper + 'def prompt_remove_channels(items):\n',
                  1,
              )

          start = text.index('async def select_from_subscriptions(client, subscribed):')
          end = text.index('async def resolve_channels(', start)
          new_select = dedent('''\
          async def select_from_subscriptions(client, subscribed):
              print("\\nВаши подписанные каналы:")

              for i, dialog in enumerate(subscribed, 1):
                  username = getattr(
                      dialog.entity,
                      "username",
                      None,
                  )
                  suffix = f" @{username}" if username else ""
                  print(f"{i:>4}. {dialog.name}{suffix}")

              print("\\nВведите номера через запятую; диапазоны — через дефис.")
              print("В этой же строке можно указывать @username и ссылки t.me.")
              print("Пример: 1,3,7-12,https://t.me/example_channel")
              print("Можно написать all или, например, all,@example_channel.")
              print("0 — Назад (сохранить прежний список).")

              while True:
                  raw = input("Выбор: ").strip()

                  if is_back_command(raw):
                      print("Создание нового списка отменено.")
                      return None

                  try:
                      selected_nums, public_values = parse_mixed_channel_selection(
                          raw,
                          len(subscribed),
                      )
                  except Exception as e:
                      print(f"Не удалось разобрать выбор: {e}")
                      print(
                          "Введите номера, диапазоны, @username или ссылки t.me "
                          "ещё раз; 0 — выход."
                      )
                      continue

                  if not selected_nums and not public_values:
                      print("Ни одного канала не выбрано.")
                      print("Введите выбор ещё раз или 0 для выхода.")
                      continue

                  items = [
                      channel_item(
                          subscribed[i - 1].entity,
                          subscribed[i - 1].name,
                      )
                      for i in sorted(selected_nums)
                  ]

                  if public_values:
                      print("\\nДобавляю публичные каналы из этой же строки:")
                      for raw_value in public_values:
                          try:
                              item = await resolve_public_channel(
                                  client,
                                  raw_value,
                              )
                          except Exception as e:
                              print(f"  Не добавлен {raw_value}: {e}")
                              continue

                          if any(
                              int(existing["id"]) == int(item["id"])
                              for existing in items
                          ):
                              print(f"  Уже есть: {item['name']}")
                              continue

                          items.append(item)
                          uname = item.get("username") or "без username"
                          print(
                              f"  Добавлен: {item['name']} (@{uname})"
                          )

                  items = dedupe_channel_items(items)
                  if not items:
                      print("Не удалось добавить ни одного канала.")
                      print("Введите выбор ещё раз или 0 для выхода.")
                      continue

                  break

              print(
                  f"\\nВыбрано подписанных каналов: {len(selected_nums)}"
              )
              if selected_nums and len(selected_nums) <= 20:
                  for i in sorted(selected_nums):
                      item = channel_item(
                          subscribed[i - 1].entity,
                          subscribed[i - 1].name,
                      )
                      username = item.get("username")
                      suffix = f" @{username}" if username else ""
                      print(f"  + {item['name']}{suffix}")
              elif len(selected_nums) > 20:
                  print(
                      "Номера приняты. Список большой, "
                      "поэтому названия не дублируются."
                  )

              public_count = len(items) - len(selected_nums)
              if public_count > 0:
                  print(
                      f"Добавлено публичных каналов из строки: {public_count}"
                  )

              print(
                  "Эти каналы уже включены в новый список. "
                  "Следующий шаг — только необязательное добавление "
                  "ещё публичных каналов без подписки."
              )

              save_selection(items)

              items = await prompt_add_public_channels(
                  client,
                  items,
              )

              items = dedupe_channel_items(items)
              save_selection(items)
              return items


          ''')
          text = text[:start] + new_select + text[end:]
          source_path.write_text(text, encoding='utf-8')

          tests_path = Path('tests/test_regressions.py')
          tests = tests_path.read_text(encoding='utf-8')
          anchor = '    def test_public_channel_prompt_does_not_reparse_number_range(self):\n'
          if anchor not in tests:
              raise SystemExit('test anchor not found')

          methods = dedent('''\
          def test_mixed_channel_selection_accepts_numbers_ranges_and_links(self):
              selected, public_values = collector.parse_mixed_channel_selection(
                  "3,7-10,12-36,https://t.me/durov,@insiderUKR",
                  40,
              )
              expected = {3, 7, 8, 9, 10} | set(range(12, 37))
              self.assertEqual(selected, expected)
              self.assertEqual(
                  public_values,
                  ["https://t.me/durov", "@insiderUKR"],
              )

          def test_mixed_channel_selection_accepts_all_plus_public_link(self):
              selected, public_values = collector.parse_mixed_channel_selection(
                  "all,https://t.me/example_channel",
                  3,
              )
              self.assertEqual(selected, {1, 2, 3})
              self.assertEqual(
                  public_values,
                  ["https://t.me/example_channel"],
              )

          def test_mixed_channel_selection_rejects_out_of_bounds_range(self):
              with self.assertRaisesRegex(ValueError, "1-35"):
                  collector.parse_mixed_channel_selection(
                      "3,12-36,https://t.me/durov",
                      35,
                  )

          def test_subscription_selection_resolves_link_from_same_input(self):
              subscribed = [
                  SimpleNamespace(
                      name="One",
                      entity=SimpleNamespace(id=1, username="one"),
                  ),
                  SimpleNamespace(
                      name="Two",
                      entity=SimpleNamespace(id=2, username="two"),
                  ),
                  SimpleNamespace(
                      name="Three",
                      entity=SimpleNamespace(id=3, username="three"),
                  ),
              ]
              public = {
                  "id": 99,
                  "name": "Public",
                  "username": "public_channel",
                  "entity": SimpleNamespace(id=99, username="public_channel"),
              }
              client = object()

              with patch(
                  "builtins.input",
                  return_value="1,3,https://t.me/public_channel",
              ):
                  with patch.object(
                      collector,
                      "resolve_public_channel",
                      AsyncMock(return_value=public),
                  ) as mocked_resolve:
                      with patch.object(
                          collector,
                          "prompt_add_public_channels",
                          AsyncMock(side_effect=lambda _client, items: items),
                      ):
                          with patch.object(collector, "save_selection"):
                              result = asyncio.run(
                                  collector.select_from_subscriptions(
                                      client,
                                      subscribed,
                                  )
                              )

              self.assertEqual(
                  [int(item["id"]) for item in result],
                  [1, 3, 99],
              )
              mocked_resolve.assert_awaited_once_with(
                  client,
                  "https://t.me/public_channel",
              )

          ''')
          addition = indent(methods, '    ')
          if 'def test_mixed_channel_selection_accepts_numbers_ranges_and_links' not in tests:
              tests = tests.replace(anchor, addition + anchor, 1)
          tests_path.write_text(tests, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              '![Release](https://img.shields.io/badge/release-5.4.8%20Stable-blue)',
              '![Release](https://img.shields.io/badge/release-5.4.9%20Stable-blue)',
              1,
          )
          old = '**На публичные каналы не обязательно быть подписанным.** Их можно добавлять по `@username`, ссылке `https://t.me/channel` или ссылке на конкретный пост. Несколько каналов можно добавить за один раз, перечислив их через запятую.\n'
          new = old.rstrip('\n') + ' При пересоздании списка в одной строке можно смешивать номера подписок, диапазоны, `@username` и ссылки `t.me`, например `3,7-10,https://t.me/channel`.\n'
          if old not in readme:
              raise SystemExit('README public-channel paragraph not found')
          readme = readme.replace(old, new, 1)
          readme_path.write_text(readme, encoding='utf-8')
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP\patch.py" -Encoding utf8
          python "$env:RUNNER_TEMP\patch.py"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile-check
        run: python -m py_compile telegram_collector_free.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Build 5.4.9 release candidate
        shell: pwsh
        run: |
          .\scripts\build_release.ps1 -OutputDirectory "$env:RUNNER_TEMP\release"
          if (-not (Test-Path "$env:RUNNER_TEMP\release\TelegramNewsAI-5.4.9-Stable-Windows.zip")) { throw '5.4.9 ZIP missing' }
          if (-not (Test-Path "$env:RUNNER_TEMP\release\TelegramNewsAI-5.4.9-Stable-Windows.sha256.txt")) { throw '5.4.9 checksum missing' }

      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram_collector_free.py tests/test_regressions.py README.md
          if (git diff --cached --quiet) { throw 'Patch produced no changes.' }
          git commit -m "fix: accept mixed channel numbers and Telegram links"
          git push origin HEAD:main
