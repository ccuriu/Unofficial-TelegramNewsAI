name: Align v5.4.7 channel fix tag once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/move-v5.4.7-channel-fix-tag-once.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Align release tag
        run: |
          git tag -f v5.4.7 1af186abe242c5d02e150d1cf0533dac2ce010ab
          git push origin --force refs/tags/v5.4.7

      - name: Verify tag
        run: |
          test "$(git ls-remote origin refs/tags/v5.4.7 | cut -f1)" = "1af186abe242c5d02e150d1cf0533dac2ce010ab"
