name: Publish v5.4.7 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v5.4.7-once.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'ccuriu/TelegramNewsAI'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: 135ddfb7d2657021adef87937f2944d1f4711cc5
      RELEASE_TAG: v5.4.7
      RELEASE_NAME: TelegramNewsAI 5.4.7 Stable

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Verify version
        shell: pwsh
        run: |
          $match = Select-String -LiteralPath '.\telegram_collector_free.py' -Pattern '^APP_VERSION\s*=\s*"([^"]+)"'
          if (-not $match) { throw 'APP_VERSION not found.' }
          $version = $match.Matches[0].Groups[1].Value
          if ($version -ne '5.4.7 Stable') { throw "Unexpected APP_VERSION: $version" }

      - name: Build clean Windows release
        shell: pwsh
        run: |
          .\scripts\build_release.ps1 -OutputDirectory "$env:RUNNER_TEMP\release"
          $zip = Join-Path $env:RUNNER_TEMP 'release\TelegramNewsAI-5.4.7-Stable-Windows.zip'
          $sum = Join-Path $env:RUNNER_TEMP 'release\TelegramNewsAI-5.4.7-Stable-Windows.sha256.txt'
          if (-not (Test-Path -LiteralPath $zip)) { throw 'Release ZIP was not created.' }
          if (-not (Test-Path -LiteralPath $sum)) { throw 'Checksum file was not created.' }

      - name: Verify exact ZIP contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Join-Path $env:RUNNER_TEMP 'release\TelegramNewsAI-5.4.7-Stable-Windows.zip'
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $prefix = 'TelegramNewsAI-5.4.7-Stable-Windows/'
            $actual = @($archive.Entries | Where-Object { $_.Name } | ForEach-Object {
              $name = $_.FullName -replace '\\', '/'
              if (-not $name.StartsWith($prefix, [StringComparison]::Ordinal)) { throw "Unexpected ZIP root: $name" }
              $name.Substring($prefix.Length)
            } | Sort-Object)
          }
          finally { $archive.Dispose() }
          $expected = @(
            'INSTALL.bat', 'LICENSE', 'README.md', 'SECURITY.md',
            'Telegram_Digest.exe', 'Telegram_Digest.exe.sha256', 'install.ps1',
            'requirements.txt', 'run_python.bat', 'start_free.bat',
            'telegram_collector_free.py'
          ) | Sort-Object
          $difference = @(Compare-Object -ReferenceObject $expected -DifferenceObject $actual)
          if ($difference.Count) { throw 'Release ZIP contents differ from whitelist.' }

      - name: Publish v5.4.7 first
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "$env:RELEASE_TAG already exists as a release." }

          $notes = @'
          ## TelegramNewsAI 5.4.7 Stable

          Актуальная стабильная Windows-версия на 14 сентября 2026 года.

          ### Что изменилось после 5.4.6

          - улучшено меню добавления одного или нескольких Telegram-каналов;
          - во вложенных пунктах `0` отменяет незавершённый ввод и возвращает в главное меню;
          - улучшены подсказки первого запуска и работа с вводом Telegram-данных;
          - README дополнен понятной инструкцией по получению Telegram API ID и API Hash;
          - расширены регрессионные проверки без изменения принципов хранения базы, поиска и формирования дайджеста.

          ### Установка

          Скачайте `TelegramNewsAI-5.4.7-Stable-Windows.zip`, проверьте SHA-256 по приложенному файлу и запустите `INSTALL.bat`.
          '@
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          $zip = Join-Path $env:RUNNER_TEMP 'release\TelegramNewsAI-5.4.7-Stable-Windows.zip'
          $sum = Join-Path $env:RUNNER_TEMP 'release\TelegramNewsAI-5.4.7-Stable-Windows.sha256.txt'
          gh release create $env:RELEASE_TAG $zip $sum --repo $env:GITHUB_REPOSITORY --target $env:RELEASE_SHA --title $env:RELEASE_NAME --notes-file $notesPath --latest

      - name: Remove older releases but keep historical tags
        shell: pwsh
        run: |
          foreach ($tag in @('v5.4.1','v5.4.2','v5.4.3','v5.4.4','v5.4.5','v5.4.6')) {
            gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes
            if ($LASTEXITCODE -ne 0) { throw "Failed to delete release $tag" }
          }

      - name: Verify release list
        shell: pwsh
        run: |
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          $tags = @($releases | ForEach-Object { $_.tag_name })
          if ($tags.Count -ne 1 -or $tags[0] -ne $env:RELEASE_TAG) {
            throw "Unexpected release list: $($tags -join ', ')"
          }
          $assets = @($releases[0].assets | ForEach-Object { $_.name } | Sort-Object)
          $expected = @('TelegramNewsAI-5.4.7-Stable-Windows.sha256.txt','TelegramNewsAI-5.4.7-Stable-Windows.zip') | Sort-Object
          if (@(Compare-Object $expected $assets).Count) { throw 'Unexpected v5.4.7 release assets.' }
