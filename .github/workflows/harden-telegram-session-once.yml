name: Harden Telegram session handling once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harden-telegram-session-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Apply focused hardening
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          source_path = Path('telegram_collector_free.py')
          text = source_path.read_text(encoding='utf-8')

          old_version = 'APP_VERSION = "5.4.7 Stable"'
          new_version = 'APP_VERSION = "5.4.8 Stable"'
          if old_version not in text:
              raise SystemExit('APP_VERSION anchor not found')
          text = text.replace(old_version, new_version, 1)

          setup_start = text.index('def setup_logging():')
          setup_end = text.index('\n\nLOGGER = ', setup_start)
          new_setup = '''def setup_logging():
              ensure_dirs()
              log_path = LOG_DIR / f"collector_{datetime.now().strftime('%Y-%m-%d')}.log"
              formatter = logging.Formatter(
                  "%(asctime)s | %(levelname)s | %(name)s | %(message)s",
                  "%Y-%m-%d %H:%M:%S",
              )

              logger = logging.getLogger("TelegramNewsAI")
              logger.setLevel(logging.INFO)
              if not logger.handlers:
                  handler = logging.FileHandler(log_path, encoding="utf-8")
                  handler.setFormatter(formatter)
                  logger.addHandler(handler)

              # Telethon пишет сетевые предупреждения через logging. Без своего
              # обработчика Python отправляет WARNING/ERROR прямо в консоль,
              # хотя библиотека часто сама восстанавливает соединение. Сохраняем
              # диагностику в файл, не пугая пользователя техническими строками.
              telethon_logger = logging.getLogger("telethon")
              telethon_logger.setLevel(logging.WARNING)
              telethon_logger.propagate = False
              if not telethon_logger.handlers:
                  telethon_handler = logging.FileHandler(log_path, encoding="utf-8")
                  telethon_handler.setFormatter(formatter)
                  telethon_logger.addHandler(telethon_handler)

              return logger
          '''.replace('          ', '')
          text = text[:setup_start] + new_setup + text[setup_end:]

          lock_start = text.index('class InstanceLock:')
          lock_end = text.index('\n\n# ============================================================', lock_start)
          new_lock = r'''class InstanceLock:
              """Single-instance guard released automatically even after a crash."""

              GLOBAL_MUTEX_NAME = r"Local\TelegramNewsAI.SingleInstance"
              ERROR_ALREADY_EXISTS = 183

              def __init__(self, path=None):
                  self.explicit_path = path is not None
                  self.path = Path(path or APP_DIR / 'collector.lock')
                  self.file = None
                  self.mutex_handle = None

              def __enter__(self):
                  # Обычный запуск Windows использует именованный kernel mutex.
                  # В отличие от collector.lock в папке программы он блокирует
                  # второй экземпляр даже из другой распакованной копии.
                  if os.name == 'nt' and not self.explicit_path:
                      kernel32 = ctypes.windll.kernel32
                      create_mutex = kernel32.CreateMutexW
                      create_mutex.argtypes = [ctypes.c_void_p, wintypes.BOOL, wintypes.LPCWSTR]
                      create_mutex.restype = wintypes.HANDLE

                      handle = create_mutex(None, False, self.GLOBAL_MUTEX_NAME)
                      if not handle:
                          raise ctypes.WinError()

                      error = kernel32.GetLastError()
                      if error == self.ERROR_ALREADY_EXISTS:
                          kernel32.CloseHandle(handle)
                          raise RuntimeError(
                              'TelegramNewsAI уже запущен в другом окне или из другой папки. '
                              'Закройте предыдущий экземпляр и повторите запуск.'
                          )

                      self.mutex_handle = handle
                      return self

                  # Явный path оставлен для тестов/служебных сценариев; на
                  # других ОС это прежняя файловая блокировка.
                  self.file = self.path.open('a+b')
                  self.file.seek(0, 2)
                  if self.file.tell() == 0:
                      self.file.write(b'0')
                      self.file.flush()
                  self.file.seek(0)

                  try:
                      if os.name == 'nt':
                          import msvcrt
                          msvcrt.locking(self.file.fileno(), msvcrt.LK_NBLCK, 1)
                      else:
                          import fcntl
                          fcntl.flock(self.file, fcntl.LOCK_EX | fcntl.LOCK_NB)
                  except OSError:
                      self.file.close()
                      self.file = None
                      raise RuntimeError(
                          'Программа уже открыта. Завершите предыдущий сбор и повторите запуск.'
                      )
                  return self

              def __exit__(self, *args):
                  if self.mutex_handle:
                      ctypes.windll.kernel32.CloseHandle(self.mutex_handle)
                      self.mutex_handle = None
                  if self.file:
                      self.file.close()
                      self.file = None
          '''.replace('          ', '')
          text = text[:lock_start] + new_lock + text[lock_end:]

          old_resolve = '''    print("\\nПолучаю список ваших подписок...")
              dialogs = await client.get_dialogs(limit=None)

              subscribed = [d for d in dialogs if d.is_channel]
              subscribed_by_id = {
                  int(d.entity.id): d
                  for d in subscribed
              }

              restored = await restore_saved_selection(
                  client,
                  subscribed_by_id,
              )
          '''.replace('              ', '    ')
          new_resolve = '''    pending_action = (
              str(initial_action).strip().lower()
              if initial_action
              else None
          )

              # A/R/L работают с уже сохранённым списком и не требуют полного
              # чтения подписок. A обращается к Telegram только за новым каналом;
              # R и L полностью локальные.
              if pending_action in ("a", "r", "l"):
                  restored = dedupe_channel_items(load_selection())

                  if pending_action == "a":
                      restored = await prompt_add_public_channels(client, restored)
                  elif pending_action == "r":
                      restored = prompt_remove_channels(restored)
                  else:
                      print_selected_channels(restored)

                  save_selection(restored)
                  return restored

              print("\\nПолучаю список ваших подписок...")
              dialogs = await client.get_dialogs(limit=None)

              subscribed = [d for d in dialogs if d.is_channel]
              subscribed_by_id = {
                  int(d.entity.id): d
                  for d in subscribed
              }

              restored = await restore_saved_selection(
                  client,
                  subscribed_by_id,
              )
          '''.replace('              ', '    ')
          if old_resolve not in text:
              raise SystemExit('resolve_channels anchor not found')
          text = text.replace(old_resolve, new_resolve, 1)

          old_pending = '''    pending_action = (
              str(initial_action).strip().lower()
              if initial_action
              else None
          )

              while True:
          '''.replace('              ', '    ')
          new_pending = '''    while True:
          '''.replace('          ', '')
          # Удаляем только второе вычисление pending_action, появившееся ниже.
          second_at = text.find(old_pending, text.find('async def resolve_channels'))
          if second_at != -1:
              text = text[:second_at] + new_pending + text[second_at + len(old_pending):]

          old_action = '''            if mode in channel_action_aliases:
                  client, creds = await ensure_telegram_client(
                      client,
                      creds,
                      settings,
                  )

                  await resolve_channels(
                      client,
                      initial_action=channel_action_aliases[mode],
                      return_after_initial=True,
                      skip_menu=False,
                  )
          '''.replace('                  ', '    ')
          new_action = '''            if mode in channel_action_aliases:
                  channel_action = channel_action_aliases[mode]

                  # Добавление и пересоздание списка требуют Telegram.
                  # Просмотр и удаление работают только с локальным JSON.
                  if channel_action in ("a", "n"):
                      client, creds = await ensure_telegram_client(
                          client,
                          creds,
                          settings,
                      )

                  await resolve_channels(
                      client,
                      initial_action=channel_action,
                      return_after_initial=True,
                      skip_menu=False,
                  )
          '''.replace('                  ', '    ')
          if old_action not in text:
              raise SystemExit('main channel action anchor not found')
          text = text.replace(old_action, new_action, 1)

          source_path.write_text(text, encoding='utf-8')

          tests_path = Path('tests/test_regressions.py')
          tests = tests_path.read_text(encoding='utf-8')
          tests = tests.replace(
              'from unittest.mock import patch',
              'from unittest.mock import AsyncMock, patch',
              1,
          )
          anchor = '    def test_numbers_are_not_near_duplicates(self):\n'
          if anchor not in tests:
              raise SystemExit('test insertion anchor not found')
          addition = '''    def test_channel_add_does_not_fetch_all_subscriptions(self):
              existing = [{"id": 10, "name": "Saved", "username": "saved_channel"}]
              client = SimpleNamespace(get_dialogs=AsyncMock())

              with patch.object(collector, "load_selection", return_value=list(existing)):
                  with patch.object(collector, "save_selection") as mocked_save:
                      with patch.object(
                          collector,
                          "prompt_add_public_channels",
                          AsyncMock(return_value=list(existing)),
                      ):
                          result = asyncio.run(
                              collector.resolve_channels(
                                  client,
                                  initial_action="a",
                                  return_after_initial=True,
                              )
                          )

              self.assertEqual(result, existing)
              client.get_dialogs.assert_not_awaited()
              mocked_save.assert_called_once_with(existing)

              @unittest.skipUnless(os.name == "nt", "Windows named mutex")
              def test_default_instance_lock_blocks_second_copy_across_folders(self):
                  with collector.InstanceLock():
                      original_app_dir = collector.APP_DIR
                      try:
                          collector.APP_DIR = self.directory / "other-copy"
                          with self.assertRaisesRegex(RuntimeError, "уже запущен"):
                              with collector.InstanceLock():
                                  pass
                      finally:
                          collector.APP_DIR = original_app_dir

          '''.replace('              ', '    ')
          tests = tests.replace(anchor, addition + anchor, 1)
          tests_path.write_text(tests, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              '![Release](https://img.shields.io/badge/release-5.4.7%20Stable-blue)',
              '![Release](https://img.shields.io/badge/release-5.4.8%20Stable-blue)',
              1,
          )
          command_note = (
              '\nTelegramNewsAI не допускает одновременный запуск двух копий программы в одной Windows-сессии, '
              'даже если они находятся в разных папках. Это защищает Telegram-сессию от конфликтующих соединений. '
              'Технические сетевые предупреждения Telethon сохраняются в `logs`, а не выводятся в обычное меню.\n'
          )
          marker = 'Во вложенных пунктах `0` отменяет незавершённый ввод и возвращает в главное меню без изменения уже сохранённого списка каналов.\n'
          if command_note.strip() not in readme:
              if marker not in readme:
                  raise SystemExit('README command marker not found')
              readme = readme.replace(marker, marker + command_note, 1)
          readme_path.write_text(readme, encoding='utf-8')

          ci_path = Path('.github/workflows/ci.yml')
          ci = ci_path.read_text(encoding='utf-8')
          ci = ci.replace('TelegramNewsAI-5.4.7-Stable-Windows', 'TelegramNewsAI-5.4.8-Stable-Windows')
          ci_path.write_text(ci, encoding='utf-8')
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP\patch.py" -Encoding utf8
          python "$env:RUNNER_TEMP\patch.py"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile-check
        run: python -m py_compile telegram_collector_free.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Build release candidate
        shell: pwsh
        run: .\scripts\build_release.ps1 -OutputDirectory "$env:RUNNER_TEMP\release"

      - name: Verify 5.4.8 release candidate exists
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:RUNNER_TEMP\release\TelegramNewsAI-5.4.8-Stable-Windows.zip")) { throw '5.4.8 ZIP missing' }
          if (-not (Test-Path "$env:RUNNER_TEMP\release\TelegramNewsAI-5.4.8-Stable-Windows.sha256.txt")) { throw '5.4.8 checksum missing' }

      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram_collector_free.py tests/test_regressions.py README.md .github/workflows/ci.yml
          if (git diff --cached --quiet) { throw 'Patch produced no changes.' }
          git commit -m "fix: harden Telegram session and single-instance handling"
          git push origin HEAD:main
