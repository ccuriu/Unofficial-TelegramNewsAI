name: Предложение
description: Предложить небольшое улучшение TelegramNewsAI
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Опишите практический сценарий. Не прикладывайте Telegram-сессии, credentials, базы, логи или личные дайджесты.

  - type: textarea
    id: problem
    attributes:
      label: Какую проблему нужно решить
      description: Что сейчас приходится делать вручную или почему текущего поведения недостаточно?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое решение
      description: Опишите минимальное желаемое поведение без личных данных.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы
      description: Какие обходные способы вы уже пробовали?

  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка приватности
      options:
        - label: В тексте и вложениях нет Telegram API-данных, сессий, базы, логов или личных сообщений.
          required: true

