name: Ошибка программы
description: Сообщить о воспроизводимой проблеме Unofficial TelegramNewsAI
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за сообщение. Не прикладывайте credentials.bin, файлы *.session, news.db, личные экспорты или другие чувствительные данные.
  - type: input
    id: version
    attributes:
      label: Версия Unofficial TelegramNewsAI
      placeholder: "например 5.5.0 Stable"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Версия Windows
      placeholder: "например Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Что произошло
      description: Опишите ожидаемое и фактическое поведение.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      placeholder: |
        1. Запустить ...
        2. Выбрать ...
        3. Получить ошибку ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Текст ошибки или безопасный фрагмент лога
      description: Удалите номера телефонов, API-данные, приватные ссылки и личные сообщения перед публикацией.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка приватности
      options:
        - label: Я проверил вложения и не публикую Telegram-сессию, credentials.bin, news.db или личные экспорты.
          required: true
