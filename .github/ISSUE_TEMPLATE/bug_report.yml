name: Ошибка программы
description: Сообщить о воспроизводимой проблеме TelegramNewsAI
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за сообщение. Не прикладывайте `credentials.bin`, файлы `*.session`, `news.db`, личные дайджесты или другие чувствительные данные.

  - type: input
    id: version
    attributes:
      label: Версия TelegramNewsAI
      placeholder: "например 5.4.6 Stable"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Версия Windows
      placeholder: "например Windows 11 24H2"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Что произошло
      description: Опишите ожидаемое и фактическое поведение.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      placeholder: |
        1. Запустить ...
        2. Выбрать ...
        3. Получить ошибку ...
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Текст ошибки или безопасный фрагмент лога
      description: Удалите номера телефонов, API-данные, приватные ссылки и любые личные сообщения перед публикацией.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка приватности
      options:
        - label: Я проверил вложения и не публикую Telegram-сессию, credentials.bin, news.db или личные дайджесты.
          required: true
